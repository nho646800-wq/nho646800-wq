<svg width="800" height="150" viewBox="0 0 800 150" xmlns="http://www.w3.org/2000/svg">
  <style>
    .zh {
      font-family: "KaiTi", "STKaiti", "BiauKai", "DFKai-SB", "Noto Serif TC", "Songti SC", serif;
      font-size: 26px;
      font-weight: bold;
      fill: #c9a96e;
      letter-spacing: 4px;
    }
    .en {
      font-family: "Georgia", "Palatino Linotype", "Times New Roman", serif;
      font-size: 16px;
      font-weight: bold;
      fill: #e6edf3;
    }
    .author {
      font-family: "Georgia", "Times New Roman", serif;
      font-size: 13px;
      font-style: italic;
      fill: #8b949e;
    }
  </style>
  <text x="50%" y="42" text-anchor="middle" class="zh">「 登高而招，臂非加長也，而見者遠。 」</text>
  <text x="50%" y="85" text-anchor="middle" class="en">“When one stands on high ground and waves, the arm is no longer than before, yet it can be seen from afar.”</text>
  <text x="50%" y="118" text-anchor="middle" class="author">— Xunzi (荀子), Encouraging Learning</text>
</svg>
